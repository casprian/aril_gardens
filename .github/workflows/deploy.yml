name: Deploy to garden subdomain (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Reads the key from a repository secret, falling back to a repository variable.
      WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY || vars.WEB3FORMS_ACCESS_KEY }}
      # Public contact details shown on the site. Defaults are set here so no secret changes are needed;
      # override by defining repository variables CONTACT_PHONE / CONTACT_EMAIL.
      CONTACT_PHONE: ${{ vars.CONTACT_PHONE || '+916362845032' }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'kashif@arilventures.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in WEB3FORMS_ACCESS_KEY FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # FTP_SERVER must be a bare hostname or IP: no protocol, path, port or whitespace.
          if [[ "$FTP_SERVER" =~ [[:space:]] ]]; then
            echo "::error::FTP_SERVER contains whitespace or a newline. Re-save the secret with only the hostname."
            exit 1
          fi
          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == */* || "$FTP_SERVER" == *:* ]]; then
            echo "::error::FTP_SERVER must be a bare hostname or IP (no ftp://, path or :port)."
            exit 1
          fi
          if ! getent hosts "$FTP_SERVER" > /dev/null; then
            echo "::error::FTP_SERVER does not resolve in public DNS. Check the hostname for typos, or use the server IP."
            exit 1
          fi

      - name: Build site with injected values
        run: |
          mkdir -p dist
          cp index.html clubhouse.html dist
          CONTACT_PHONE_DIGITS="${CONTACT_PHONE//[^0-9]/}"
          sed -i \
            -e "s|__WEB3FORMS_ACCESS_KEY__|${WEB3FORMS_ACCESS_KEY}|g" \
            -e "s|__CONTACT_PHONE_DIGITS__|${CONTACT_PHONE_DIGITS}|g" \
            -e "s|__CONTACT_PHONE__|${CONTACT_PHONE}|g" \
            -e "s|__CONTACT_EMAIL__|${CONTACT_EMAIL}|g" \
            dist/*.html
          if grep -qE "__(WEB3FORMS_ACCESS_KEY|CONTACT_PHONE|CONTACT_PHONE_DIGITS|CONTACT_EMAIL)__" dist/*.html; then
            echo "::error::A build placeholder was not replaced."
            exit 1
          fi

      - name: Upload to garden folder over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/garden/' }}
